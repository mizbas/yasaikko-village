<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2433">
<title>やさいっこ冒険村</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: スマホ縦1画面。上に村の状態、中央にドット絵の村（整数倍で拡大）、その下にお知らせの1行、いちばん下に5つのボタン。 */
:root{
  --bg:#1c2433;
  --panel:#283246;
  --panel-2:#323e56;
  --line:#4a5878;
  --ink:#f4f1e6;
  --muted:#a9b3c9;
  --gold:#f2c53d;
  --accent:#f08a48;
  --good:#7cc265;
  --bad:#ef6a5a;
  --pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--pix);line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding-block:8px 6px;align-items:center}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px;align-items:baseline;min-width:0}
.stats b{font-weight:400}
.money{color:var(--gold);font-size:20px}
.fame{color:#ff9fb8}
.rankline{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.rankline .rk{color:var(--ink)}
.sbtns{display:flex;gap:6px}
.sb{width:34px;height:34px;border-radius:6px;border:2px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:15px}
.sb[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.sb.wait{border-color:var(--accent);color:var(--accent)}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #10151f;border-radius:4px;box-shadow:0 0 0 2px var(--line);touch-action:manipulation;cursor:pointer}
.placebar{position:absolute;left:0;right:0;top:6px;display:flex;justify-content:center;pointer-events:none}
.placebar div{pointer-events:auto;background:#10151fdd;border:2px solid var(--gold);border-radius:6px;padding:6px 10px;font-size:13px;display:flex;gap:10px;align-items:center}
.placebar button{border:2px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 10px;cursor:pointer}
.ticker{flex:0 0 auto;margin-top:6px;background:#10151f;border:2px solid var(--line);border-radius:4px;padding:5px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:31px}
.ticker .t{color:var(--gold)}
nav.bottom{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.bottom button{position:relative;border:2px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-height:54px;box-shadow:0 3px 0 #10151f}
nav.bottom button:active{transform:translateY(2px);box-shadow:0 1px 0 #10151f}
nav.bottom canvas{width:24px;height:24px;image-rendering:pixelated}
nav.bottom .nb{position:absolute;top:-6px;right:-4px;min-width:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:#2a1405;font-size:11px;line-height:18px}
.sheet{position:fixed;inset:0;z-index:30;background:#0a0e16bb;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:min(560px,100%);max-height:82%;background:var(--bg);border-top:3px solid var(--line);border-radius:10px 10px 0 0;padding:12px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-h h3{margin:0;font-weight:400;font-size:19px;color:var(--gold)}
.x{border:2px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 12px;cursor:pointer}
.lead{margin:0;font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;width:100%;cursor:pointer}
.row canvas{width:44px;height:44px;image-rendering:pixelated;background:#10151f;border-radius:4px}
.row .t{font-size:15px}
.row .d{font-size:12px;color:var(--muted);line-height:1.45}
.row .p{color:var(--gold);white-space:nowrap;font-size:14px}
.row.lock{opacity:.45;cursor:default}
.row.poor .p{color:var(--muted)}
.row.done{border-color:var(--good)}
.row.done .p{color:var(--good)}
.bar{display:block;height:6px;background:#10151f;border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--good)}
.bar.hp i{background:var(--bad)}
.btn{border:2px solid #10151f;border-radius:6px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#2a1405;font-size:15px;box-shadow:0 3px 0 #10151f}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn[aria-disabled="true"]{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.banner{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;width:min(92%,420px);background:#10151f;border:3px solid var(--gold);border-radius:8px;padding:10px 14px;text-align:center;box-shadow:0 8px 0 #0008;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.banner b{display:block;color:var(--gold);font-weight:400;font-size:19px}
.banner span{font-size:13px}
@keyframes pop{from{transform:translateX(-50%) translateY(20px) scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div id="app">
  <header class="top">
    <div class="stats"><b class="money" id="money">0G</b><b class="fame" id="fame">人気 0</b><b id="pop">冒険者 0</b></div>
    <div class="sbtns"><button type="button" class="sb" id="snd-bgm" aria-pressed="true" aria-label="BGM">♪</button><button type="button" class="sb" id="snd-sfx" aria-pressed="true" aria-label="効果音">♫</button></div>
    <div class="rankline"><span>村ランク <span class="rk" id="rank">小さな集落</span></span><span id="date">1年目 春 1日</span></div>
  </header>
  <div class="stagewrap" id="wrap">
    <canvas id="cv" aria-label="村の地図。空いているマスをタップすると建物を建てられます。建物や冒険者をタップすると、くわしく見られます"></canvas>
    <div class="placebar" id="placebar" hidden><div><span id="placet"></span><button type="button" id="placex">やめる</button></div></div>
  </div>
  <div class="ticker" id="ticker" aria-live="polite"></div>
  <nav class="bottom" aria-label="メニュー">
    <button type="button" data-m="build"><canvas data-ic="build"></canvas>建てる</button>
    <button type="button" data-m="advs"><canvas data-ic="advs"></canvas>冒険者</button>
    <button type="button" data-m="dun"><canvas data-ic="dun"></canvas>ダンジョン<b class="nb" hidden></b></button>
    <button type="button" data-m="goal"><canvas data-ic="goal"></canvas>目標<b class="nb" hidden></b></button>
    <button type="button" data-m="combo"><canvas data-ic="combo"></canvas>コンボ<b class="nb" hidden></b></button>
  </nav>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-in"><div class="sh-h"><h3 id="sht"></h3><button type="button" class="x" id="shx">とじる</button></div><div id="shb"></div></div></div>
<div id="bannerbox"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const AKEY='yasaikko-village-audio';
const mf=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];
const MEL_FIELD=[[[4,1],[7,1],[9,1],[7,1],[4,2],[2,1],[0,1]],[[2,2],[4,1],[0,1],[-3,2],[null,2]],[[0,1],[2,1],[4,1],[5,1],[9,2],[7,2]],[[7,1],[4,1],[2,2],[null,2],[-1,1],[2,1]],
  [[4,1],[7,1],[12,2],[9,1],[7,1],[9,2]],[[12,1],[9,1],[7,2],[4,2],[null,2]],[[5,1],[4,1],[2,1],[0,1],[2,2],[4,2]],[[2,1],[4,1],[2,1],[-1,1],[0,4]]];
const MEL_SHOP=[[[0,1],[2,1],[4,1],[7,1],[9,2],[7,2]],[[9,1],[7,1],[4,1],[2,1],[4,2],[null,2]],[[2,1],[4,1],[5,1],[7,1],[9,1],[12,1],[9,2]],[[7,2],[4,1],[2,1],[0,2],[null,2]],
  [[12,1],[12,1],[9,1],[7,1],[9,2],[12,2]],[[14,1],[12,1],[9,2],[7,2],[null,2]],[[5,1],[7,1],[9,1],[12,1],[9,1],[7,1],[5,2]],[[4,1],[7,1],[2,1],[4,1],[0,4]]];
const MEL_NIGHT=[[[9,3],[7,1],[4,4]],[[5,2],[4,2],[0,4]],[[4,3],[7,1],[12,4]],[[11,2],[7,2],[null,4]],[[9,2],[12,2],[16,2],[14,2]],[[12,4],[9,4]],[[7,2],[9,2],[12,2],[11,2]],[[9,8]]];
function flat(mel){const out=new Array(64).fill(null);mel.forEach((bar,b)=>{let p=0;bar.forEach(([n,l])=>{if(n!=null)out[b*8+p]={n,l};p+=l})});return out}
const AU={ctx:null,bgmG:null,sfxG:null,noise:null,on:{bgm:true,sfx:true},song:null,want:'field',step:0,next:0};
try{const a=JSON.parse(localStorage.getItem(AKEY)||'{}');if(a.bgm!=null)AU.on.bgm=a.bgm;if(a.sfx!=null)AU.on.sfx=a.sfx}catch(e){}
function auSavePref(){try{localStorage.setItem(AKEY,JSON.stringify(AU.on))}catch(e){}}
function auUnlock(c){
  try{const b=c.createBuffer(1,1,22050),src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start(0)}catch(e){}
  const r=c.resume&&c.resume();if(r&&r.then)r.then(updateSnd,()=>{});
}
function auInit(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(AU.ctx){if(AU.ctx.state!=='running'&&!document.hidden)auUnlock(AU.ctx);updateSnd();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC()}catch(e){return}
  AU.ctx=c;if(c.addEventListener)c.addEventListener('statechange',updateSnd);
  const comp=c.createDynamicsCompressor();comp.connect(c.destination);
  const master=c.createGain();master.gain.value=.85;master.connect(comp);
  AU.bgmG=c.createGain();AU.bgmG.gain.value=AU.on.bgm?.42:0;AU.bgmG.connect(master);
  AU.sfxG=c.createGain();AU.sfxG.gain.value=AU.on.sfx?.7:0;AU.sfxG.connect(master);
  const buf=c.createBuffer(1,c.sampleRate*.4,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=buf;
  AU.song=SONGS[AU.want];AU.step=0;AU.next=c.currentTime+.15;
  setInterval(auSchedule,25);
  auUnlock(c);
}
function tone(dest,o){
  const c=AU.ctx,t=o.t,osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.sweep||.1));
  let node=osc;if(o.filt){const bq=c.createBiquadFilter();bq.type='lowpass';bq.frequency.value=o.filt;osc.connect(bq);node=bq}
  node.connect(g);g.connect(dest);
  const a=o.a||.005,v=o.v||.1,len=o.len||0,dec=o.d||.3;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);
  if(len){g.gain.setValueAtTime(v,t+a+len);g.gain.exponentialRampToValueAtTime(.0001,t+a+len+dec)}
  else g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);
  osc.start(t);osc.stop(t+a+len+dec+.05);
}
function hiss(dest,t,v,hp,dur){
  const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(g);g.connect(dest);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.start(t,Math.random()*.3);s.stop(t+dur+.02);
}
function lead(kind,f,t,dur){
  const d=AU.bgmG;
  if(kind==='ocarina'){tone(d,{type:'triangle',f,t,a:.025,len:dur*.8,d:.09,v:.12});tone(d,{type:'sine',f:f*2,t,a:.03,len:dur*.6,d:.08,v:.02})}
  else if(kind==='bell'){tone(d,{type:'sine',f,t,d:1.6,v:.1});tone(d,{type:'sine',f:f*2.76,t,d:.6,v:.025});tone(d,{type:'sine',f:f*5.4,t,d:.25,v:.01})}
  else if(kind==='steel'){tone(d,{type:'sine',f,t,d:.45,v:.11});tone(d,{type:'sine',f:f*2,t,d:.25,v:.045});tone(d,{type:'triangle',f:f*3,t,d:.12,v:.015})}
  else if(kind==='chip'){tone(d,{type:'square',f,t,a:.004,len:Math.min(dur*.55,.18),d:.06,v:.035,filt:2200});tone(d,{type:'sine',f,t,d:.2,v:.04})}
}
function auSchedule(){
  const c=AU.ctx;if(!c||c.state!=='running')return;
  if(AU.next<c.currentTime-.2)AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.12){
    const s=AU.song,e=60/s.bpm/2,st=AU.step%64,bar=Math.floor(st/8),pos=st%8,t=AU.next,d=AU.bgmG;
    const ch=PROG[s.prog[bar]],root=s.root;
    const m=s.mel[st];if(m)lead(s.lead,mf(root+m.n),t,m.l*e);
    if(s.sparse){
      if(pos===0){tone(d,{type:'sine',f:mf(root-12+ch[0]),t,a:.2,len:e*6,d:.8,v:.08});ch.forEach((n,i)=>tone(d,{type:'sine',f:mf(root+n),t:t+i*e*.5,d:1.4,v:.022}))}
      if(pos===4)ch.forEach((n,i)=>tone(d,{type:'sine',f:mf(root+12+n),t:t+i*e*.33,d:.9,v:.012}));
    }else{
      if(pos===0)tone(d,{type:'triangle',f:mf(root-12+ch[0]),t,len:e*1.4,d:.15,v:.16,filt:700});
      if(pos===4)tone(d,{type:'triangle',f:mf(root-12+ch[0]+7),t,len:e*1.2,d:.15,v:.13,filt:700});
      if(pos===2||pos===6)ch.forEach(n=>tone(d,{type:'triangle',f:mf(root+n),t,d:.16,v:.03}));
      if(s.lead==='chip'&&(pos===3||pos===7))ch.forEach(n=>tone(d,{type:'triangle',f:mf(root+n),t,d:.1,v:.018}));
      hiss(d,t,pos%2?.028:.016,7000,.035);
      if(s.kick&&(pos===0||pos===4))tone(d,{type:'sine',f:140,f2:45,sweep:.12,t,d:.14,v:.22});
    }
    AU.step++;
    AU.next+=e*(1+(pos%2?-s.swing:s.swing));
    if(AU.step%8===0&&SONGS[AU.want]!==AU.song){AU.song=SONGS[AU.want];AU.step=0}
  }
}
const MEL_BATTLE=[[[9,1],[12,1],[16,1],[12,1],[9,1],[12,1],[16,2]],[[17,1],[16,1],[12,1],[9,1],[5,2],[9,2]],[[7,1],[11,1],[14,1],[11,1],[19,2],[14,2]],[[16,1],[14,1],[12,1],[11,1],[9,4]],
  [[21,1],[19,1],[16,1],[19,1],[21,2],[16,2]],[[17,1],[21,1],[24,2],[21,2],[17,2]],[[19,1],[17,1],[14,1],[11,1],[14,2],[19,2]],[[16,1],[12,1],[11,1],[12,1],[9,4]]];
const SONGS={
  day:{name:'むらのうた',bpm:104,root:60,lead:'chip',prog:[0,1,2,3,0,1,2,3],mel:flat(MEL_FIELD),swing:.1,kick:false},
  night:{name:'よるのうた',bpm:74,root:60,lead:'bell',prog:[1,2,0,3,1,2,0,3],mel:flat(MEL_NIGHT),swing:0,kick:false,sparse:true},
  raid:{name:'しゅうげきのうた',bpm:144,root:60,lead:'chip',prog:[1,2,3,1,1,2,3,1],mel:flat(MEL_BATTLE),swing:0,kick:true}
};
AU.want='day';
function auWant(w){if(SONGS[w]&&AU.want!==w)AU.want=w;updateSnd()}
function sfx(name){
  if(!AU.ctx||!AU.on.sfx||AU.ctx.state!=='running')return;
  const t=AU.ctx.currentTime,d=AU.sfxG;
  const sq=(f,dt,len,v)=>tone(d,{type:'square',f,t:t+dt,d:len,v:v||.035,filt:4000});
  switch(name){
    case'coin':sq(1318,0,.05);sq(1760,.06,.18);break;
    case'build':[0,1,2].forEach(i=>{tone(d,{type:'square',f:180-i*20,t:t+i*.09,d:.06,v:.05,filt:900});hiss(d,t+i*.09,.06,1500,.05)});[0,4,7,12].forEach((n,i)=>sq(mf(72+n),.3+i*.06,.1));break;
    case'level':[0,4,7,12].forEach((n,i)=>sq(mf(76+n),i*.07,.12,.04));break;
    case'combo':[0,4,7,12,7,12,16,19].forEach((n,i)=>sq(mf(72+n),i*.08,i===7?.5:.12,.045));break;
    case'rank':[0,0,4,7,12,12,16,19,24].forEach((n,i)=>sq(mf(67+n),i*.1,i===8?.7:.12,.05));break;
    case'arrive':[0,7,12].forEach((n,i)=>tone(d,{type:'triangle',f:mf(79+n),t:t+i*.06,d:.15,v:.06}));break;
    case'tap':tone(d,{type:'square',f:880,t,d:.04,v:.025,filt:3000});break;
    case'no':sq(220,0,.08);sq(180,.09,.12);break;
    case'hit':tone(d,{type:'square',f:160,f2:60,sweep:.1,t,d:.1,v:.06,filt:1200});hiss(d,t,.08,1500,.06);break;
    case'poof':hiss(d,t,.1,800,.25);tone(d,{type:'square',f:400,f2:100,sweep:.2,t,d:.2,v:.04,filt:1500});break;
    case'alarm':[0,1,2,3].forEach(i=>sq(i%2?660:880,i*.15,.12,.05));break;
    case'move':[0,4,7,12,16].forEach((n,i)=>tone(d,{type:'triangle',f:mf(72+n),t:t+i*.07,d:.3,v:.07}));break;
  }
}
function updateSnd(){
  const live=AU.ctx&&AU.ctx.state==='running';
  [['#snd-bgm','bgm'],['#snd-sfx','sfx']].forEach(([s,k])=>{const el=$(s);el.setAttribute('aria-pressed',AU.on[k]?'true':'false');el.classList.toggle('wait',!live&&AU.on[k])});
}
function setSnd(kind){
  const live=AU.ctx&&AU.ctx.state==='running';
  if(!live&&AU.on[kind]){auInit();updateSnd();return}
  AU.on[kind]=!AU.on[kind];auSavePref();auInit();
  if(AU.ctx){const g=kind==='bgm'?AU.bgmG:AU.sfxG,v=AU.on[kind]?(kind==='bgm'?.4:.7):0;g.gain.setTargetAtTime(v,AU.ctx.currentTime,.08)}
  updateSnd();if(kind==='sfx')sfx('tap');
}
['pointerup','click','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{if(AU.on.bgm||AU.on.sfx)auInit()},{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume()});
$('#snd-bgm').onclick=()=>setSnd('bgm');$('#snd-sfx').onclick=()=>setSnd('sfx');

/* ---------- utils ---------- */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>{n=Math.floor(n);if(n>=1e8)return(n/1e8).toFixed(1)+'億';if(n>=1e4)return(n/1e4).toFixed(n>=1e5?0:1)+'万';return n.toLocaleString('ja-JP')};

function fresh(){
  const g=[];for(let r=0;r<GH;r++){const row=[];for(let c=0;c<GW;c++)row.push(null);g.push(row)}
  const s={gold:600,bonusFame:0,day:1,tod:0,rank:0,grid:g,advs:[],nid:1,clears:{},found:{},goal:0,raidAt:4,nextArrive:3,stats:{earned:0,visits:0},income:0,last:Date.now(),v:1};

  return s;
}
function save(){if(!S)return;S.last=Date.now();try{const copy=Object.assign({},S,{advs:S.advs.map(a=>{const o=Object.assign({},a);delete o.path;delete o.bub;return o})});localStorage.setItem(KEY,JSON.stringify(copy))}catch(e){}}

const cell=(c,r)=>r>=0&&r<GH&&c>=0&&c<GW?S.grid[r][c]:null;
function allB(type){const out=[];for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){const x=S.grid[r][c];if(x&&(!type||x.b===type))out.push({c,r,x})}return out}
const countB=t=>allB(t).length;
const residents=()=>S.advs.filter(a=>a.res).length;
function activeCombos(){
  const on={};
  for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){const x=S.grid[r][c];if(!x)continue;
    [[1,0],[0,1]].forEach(([dc,dr])=>{const y=cell(c+dc,r+dr);if(!y)return;COMBOS.forEach(k=>{if((x.b===k.a&&y.b===k.b)||(x.b===k.b&&y.b===k.a))on[k.id]=true})})}
  return on;
}
let COMBO_ON={};
function refreshCombos(silent){
  COMBO_ON=activeCombos();
  Object.keys(COMBO_ON).forEach(id=>{if(!S.found[id]){S.found[id]=true;if(!silent){const k=COMBOS.find(x=>x.id===id);sfx('combo');banner('コンボ発見！「'+k.n+'」',k.d);log('コンボ「'+k.n+'」が生まれた！')}}});
}
const comboOn=id=>!!COMBO_ON[id];
function fame(){
  let f=S.bonusFame;
  allB().forEach(({x})=>{const d=BLD[x.b];f+=d.deco||(3+2*(x.lv-1))});
  if(comboOn('prep'))f+=10;if(comboOn('plaza'))f+=20;if(comboOn('holy'))f+=10;if(comboOn('farm'))f+=15;if(comboOn('inns'))f+=5;if(comboOn('hero'))f+=40;
  return Math.round(f);
}
function rankScore(){return fame()+residents()*8+allB().reduce((a,{x})=>a+(BLD[x.b].deco?0:x.lv*3),0)}
function feeOf(type,lv){
  const d=BLD[type];let f=d.fee*(1+.32*(lv-1));
  if((type==='inn'||type==='diner')&&comboOn('rest'))f*=1.3;
  if(type==='diner'&&comboOn('fresh'))f*=1.5;
  if(type==='inn'&&comboOn('inns'))f*=1.2;
  if(type==='hokora'&&comboOn('holy'))f*=1.3;
  return Math.round(f);
}
const gearPrice=tier=>Math.round(70*Math.pow(tier,1.7)*(comboOn('gear')?1.3:1));

const advCap=()=>Math.min(20,3+countB('inn')*2+allB('house').reduce((a,{x})=>a+1+x.lv,0)+S.rank);

/* ---------- adventurers ---------- */
function newAdv(){

  recalc(a);a.hp=a.maxHp;return a;
}
function recalc(a){
  const J=JOBS[a.job],pm=a.promo?1.3:1;
  a.maxHp=Math.round((22+a.lv*9)*J.hp*pm);a.atk=Math.round((4+a.lv*2.2)*J.atk*pm+a.wpn*5);a.def=Math.round((1+a.lv*1.1)*J.def*pm+a.arm*4);
}
const power=a=>a.atk*2+a.def*1.5+a.maxHp/4+a.pot*4;
const jobName=a=>a.promo?JOBS[a.job].p:JOBS[a.job].n;
const needExp=lv=>Math.round(12*Math.pow(lv,1.45));
function gainExp(a,n){
  a.exp+=n;let up=false;
  while(a.exp>=needExp(a.lv)){a.exp-=needExp(a.lv);a.lv++;up=true}
  if(up){const old=a.maxHp;recalc(a);a.hp+=a.maxHp-old;if(inVillage(a)){bubble(a,'up');float(a.x,a.y-14,'LvUP!','#ffe06a');sfx('level')}log(a.name+'のレベルが'+a.lv+'に上がった')}
}
const inVillage=a=>a.state!=='dungeon'&&a.state!=='gone';

/* ---------- pathfinding ---------- */
function walkable(c,r){if(c===ROAD&&(r===-1||r===GH))return true;if(c<0||c>=GW||r<0||r>=GH)return false;const x=S.grid[r][c];return !x||x.b==='flower'||x.b==='field'}
function bfs(sc,sr,goalFn){
  const key=(c,r)=>c+','+(r+1);const prev={},q=[[sc,sr]];prev[key(sc,sr)]=null;
  while(q.length){const [c,r]=q.shift();if(goalFn(c,r)){const path=[];let k=key(c,r),cur=[c,r];while(cur){path.unshift(cur);cur=prev[key(cur[0],cur[1])]}return path}
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dc,dr])=>{const nc=c+dc,nr=r+dr,k=key(nc,nr);if(k in prev||!walkable(nc,nr))return;prev[k]=[c,r];q.push([nc,nr])})}
  return null;
}
const tileOf=a=>[clamp(Math.round((a.x-8)/T),0,GW-1),clamp(Math.round((a.y-TOP-8)/T),-1,GH)];
function goTo(a,goalFn,then){
  const [c,r]=tileOf(a);let sc=c,sr=r;if(!walkable(sc,sr)){sc=ROAD}
  const p=bfs(sc,sr,goalFn);if(!p){return false}
  a.path=p.map(([c,r])=>({x:cx(c),y:cy(r)}));a.state='walk';a.then=then;return true;
}
function nearestBuilding(a,type,filter){
  let best=null,bl=1e9;
  allB(type).forEach(b=>{if(filter&&!filter(b))return;const [c,r]=tileOf(a);const p=bfs(walkable(c,r)?c:ROAD,walkable(c,r)?r:r,(x,y)=>Math.abs(x-b.c)+Math.abs(y-b.r)===1);if(p&&p.length<bl){bl=p.length;best=b}});
  return best;
}
function visit(a,type,why){
  const b=nearestBuilding(a,type,BLD[type].fee?(z=>feeOf(type,z.x.lv)<=a.gold):null);if(!b)return false;
  return goTo(a,(x,y)=>Math.abs(x-b.c)+Math.abs(y-b.r)===1,{k:'enter',c:b.c,r:b.r,why});
}

/* ---------- decisions ---------- */
const night=()=>S.tod>=.72;
function decide(a){
  if(raid&&!a.ko&&raid.mons.some(m=>m.hp>0)){a.state='fight';return}
  const hpR=a.hp/a.maxHp;
  if(a.ko||hpR<.35){if(visit(a,'hokora'))return;if(visit(a,'inn'))return;camp(a);return}
  if(night()&&(hpR<1||Math.random()<.6)&&visit(a,'inn'))return;
  if(hpR<.7){if(visit(a,'inn'))return;camp(a);return}
  if(a.pot<2&&a.gold>=feeOf('shop',1)&&visit(a,'shop'))return;
  const ws=allB('weapon').reduce((m,{x})=>Math.max(m,x.lv),0);if(ws>a.wpn&&a.gold>=gearPrice(a.wpn+1)&&visit(a,'weapon'))return;
  const as=allB('armor').reduce((m,{x})=>Math.max(m,x.lv),0);if(as>a.arm&&a.gold>=gearPrice(a.arm+1)&&visit(a,'armor'))return;
  if(a.lv>=10&&!a.promo&&countB('train')&&visit(a,'train'))return;
  if(a.mood<55&&a.gold>=feeOf('diner',1)&&visit(a,'diner'))return;
  if(a.gold>=feeOf('train',1)*2&&Math.random()<.25&&visit(a,'train'))return;
  if(Math.random()<.15&&a.gold>=feeOf('diner',1)&&visit(a,'diner'))return;
  if(!a.res&&a.trips>=4&&Math.random()<.5){goTo(a,(c,r)=>c===ENTR.c&&r===ENTR.r,{k:'leave'});bubble(a,'wave');return}
  if(!a.strolled&&Math.random()<.6){a.strolled=true;const spots=[];for(let r=0;r<GH;r++)for(let c=0;c<GW;c++)if(walkable(c,r))spots.push([c,r]);const [sc,sr]=pick(spots);
    if(goTo(a,(c,r)=>c===sc&&r===sr,{k:'stroll'})){if(Math.random()<.4)bubble(a,pick(['heart','wave','star']));return}}
  a.strolled=false;
  goTo(a,(c,r)=>c===GATE.c&&r===GATE.r,{k:'dungeon'});
}
function camp(a){a.state='idle';a.timer=6;a.hp=Math.max(a.hp,Math.round(a.maxHp*.75));a.ko=false;bubble(a,'zzz');a.mood=clamp(a.mood-3,0,100)}
function enter(a,c,r){
  const x=cell(c,r);if(!x){a.state='idle';return}
  a.state='in';a.inB={c,r};a.x=cx(c);a.y=cy(r)+2;
  const d=BLD[x.b];a.timer=(d.dur||3)*(x.b==='inn'&&night()?2:1);
}
function leaveBuilding(a){
  const {c,r}=a.inB,x=cell(c,r);a.inB=null;
  const out=[[c,r+1],[c-1,r],[c+1,r],[c,r-1]].find(([cc,rr])=>walkable(cc,rr)&&rr<GH);
  if(out){a.x=cx(out[0]);a.y=cy(out[1])}
  a.state='idle';a.timer=.4+Math.random()*.8;
  if(!x)return;
  const t=x.b,bx=cx(c),by=cy(r);let paid=0;
  if(t==='inn'){const f=feeOf('inn',x.lv);if(a.gold>=f){a.gold-=f;paid=f;a.hp=a.maxHp;a.ko=false;a.mood=clamp(a.mood+5,0,100);bubble(a,'heart')}else{a.hp=Math.max(a.hp,Math.round(a.maxHp*.6));a.mood-=5;bubble(a,'sweat')}}
  else if(t==='shop'){const f=feeOf('shop',x.lv);let n=0;while(a.pot<3&&a.gold>=f){a.gold-=f;paid+=f;a.pot++;n++}if(n)bubble(a,'coin')}
  else if(t==='diner'){const f=feeOf('diner',x.lv);if(a.gold>=f){a.gold-=f;paid=f;a.mood=clamp(a.mood+18,0,100);a.hp=Math.min(a.maxHp,a.hp+Math.round(a.maxHp*.15));bubble(a,'heart')}}
  else if(t==='weapon'){const p=gearPrice(a.wpn+1);if(x.lv>a.wpn&&a.gold>=p){a.gold-=p;paid=p;a.wpn++;recalc(a);bubble(a,'sword');log(a.name+'が新しい武器を買った（攻撃'+a.atk+'）')}}
  else if(t==='armor'){const p=gearPrice(a.arm+1);if(x.lv>a.arm&&a.gold>=p){a.gold-=p;paid=p;a.arm++;recalc(a);bubble(a,'shield');log(a.name+'が新しい防具を買った（守り'+a.def+'）')}}
  else if(t==='train'){
    if(a.lv>=10&&!a.promo){a.promo=true;const old=a.maxHp;recalc(a);a.hp+=a.maxHp-old;bubble(a,'up');sfx('rank');banner('転職！',a.name+'は'+JOBS[a.job].n+'から'+JOBS[a.job].p+'になった');log(a.name+'が'+JOBS[a.job].p+'に転職した')}
    const f=feeOf('train',x.lv);if(a.gold>=f){a.gold-=f;paid=f;gainExp(a,Math.round((6+x.lv*4)*(comboOn('forest')?1.5:1)));bubble(a,'star')}}
  else if(t==='hokora'){const f=feeOf('hokora',x.lv);if(a.gold>=f){a.gold-=f;paid=f;a.hp=a.maxHp;a.ko=false;a.mood=clamp(a.mood+8,0,100);bubble(a,'heart')}}
  if(paid){earn(paid,bx,by-6);x.sales=(x.sales||0)+paid;S.stats.visits++}
}
let incomeWin=0;
function earn(n,x,y){S.gold+=n;S.stats.earned+=n;incomeWin+=n;float(x,y,'+'+fmt(n)+'G','#ffe06a');sfx('coin')}

/* ---------- dungeon ---------- */
function pickDungeon(a){
  const p=power(a);let best=DUN[0];
  DUN.forEach(d=>{if(d.rank<=S.rank&&p>=d.pow*.85)best=d});
  return best;

function departDungeon(a){

  });

}

/* ---------- main update ---------- */
let placing=null,sel=null,saveAcc=0,uiAcc=0,dayAcc=0;
const DAY_SEC=150;
function update(dt){
  const wasNight=night();S.tod+=dt/DAY_SEC;
  if(S.tod>=1){S.tod-=1;S.day++;onNewDay()}
  if(night()!==wasNight&&!raid)auWant(night()?'night':'day');
  // arrivals
  S.nextArrive-=dt;
  if(S.nextArrive<=0){S.nextArrive=clamp(26-fame()*.14,6,26)*(night()?2:1)*(0.7+Math.random()*.6);
    if(S.advs.length<advCap()){const a=newAdv();S.advs.push(a);sfx('arrive');log(a.name+'（'+jobName(a)+' Lv'+a.lv+'）が村にやってきた');bubble(a,'bang');a.state='idle';a.timer=.3}}
  if(raid)raidTick(dt);
  S.advs.forEach(a=>{
    if(a.bub)a.bub.t-=dt;if(a.flash>0)a.flash-=dt;
    if(a.state==='dungeon'){if(Date.now()>=a.dun.end){const r=resolveDungeon(a,false);a.state='idle';a.x=cx(GATE.c);a.y=cy(GATE.r);a.timer=.2;bubble(a,r.ok?'coin':'sweat');if(r.share)float(a.x,a.y,'+'+fmt(r.share)+'G','#ffe06a');a.dun=null}return}
    if(a.state==='fight'){if(!raid){a.state='idle'}return}
    if(a.state==='in'){a.timer-=dt;const x=cell(a.inB.c,a.inB.r);if(x)x.busy=.5;if(a.timer<=0)leaveBuilding(a);return}
    if(a.state==='walk'){
      const p=a.path&&a.path[0];if(!p){arrive(a);return}
      const dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),sp=(a.ko?9:15)*dt;
      if(d<=sp){a.x=p.x;a.y=p.y;a.path.shift();if(!a.path.length)arrive(a)}else{a.x+=dx/d*sp;a.y+=dy/d*sp;if(Math.abs(dx)>.1)a.dir=dx>0?1:-1}
      a.walkT=(a.walkT||0)+dt;return}
    if(a.state==='idle'){a.timer-=dt;if(a.timer<=0){decide(a);if(a.state==='idle')a.timer=1+Math.random()}}
  });
  S.advs=S.advs.filter(a=>a.state!=='gone');
  allB().forEach(({x})=>{if(x.busy>0)x.busy-=dt});
  // goals
  while(S.goal<GOALS.length&&GOALS[S.goal].f()){const g=GOALS[S.goal];S.gold+=g.r;S.goal++;sfx('level');banner('目標たっせい！',g.d+' ・ ごほうび '+fmt(g.r)+'G');log('目標「'+g.d+'」をたっせいした')}
  // rank
  const sc=rankScore();let rk=0;RANKS.forEach((R,i)=>{if(sc>=R.at)rk=i});
  if(rk>S.rank){S.rank=rk;sfx('rank');banner('村ランクアップ！','「'+RANKS[rk].n+'」になった！ 新しい建物とダンジョンが解放された');log('村が「'+RANKS[rk].n+'」になった！')}
  saveAcc+=dt;if(saveAcc>8){saveAcc=0;S.income=S.income*.7+incomeWin/8*.3;incomeWin=0;save()}
  uiAcc+=dt;if(uiAcc>.4){uiAcc=0;updateUI()}
}
function arrive(a){
  const th=a.then;a.then=null;a.path=null;
  if(!th){a.state='idle';a.timer=1;return}
  if(th.k==='enter'){const x=cell(th.c,th.r);if(x){a.x=cx(th.c);a.y=cy(th.r)+4;enter(a,th.c,th.r)}else{a.state='idle';a.timer=.5}}
  else if(th.k==='dungeon')departDungeon(a);
  else if(th.k==='leave'){a.state='gone';log(a.name+'は次の旅へ出発していった')}
  else if(th.k==='stroll'){a.state='idle';a.timer=1.5+Math.random()*3}
  else{a.state='idle';a.timer=.5}
}
function onNewDay(){
  if(S.rank>=1&&S.day>=S.raidAt&&!raid&&Math.random()<.6)startRaid();

  const c=Math.floor(x/T),row=Math.floor((y-TOP)/T);
  // adventurer hit first
  const hitA=S.advs.filter(a=>inVillage(a)&&a.state!=='in').find(a=>Math.abs(a.x-x)<6&&y>a.y-12&&y<a.y+2);
  if(placing){if(row>=0&&row<GH&&c>=0&&c<GW&&c!==ROAD&&!S.grid[row][c]){const k=placing;if(build(k,c,row)){if(S.gold<BLD[k].cost){placing=null;$('#placebar').hidden=true}}}else{sfx('no')}return}
  if(hitA){sfx('tap');openAdv(hitA.id);return}
  if(row<0){sfx('tap');openDun();return}
  if(row>=GH||c<0||c>=GW)return;
  if(c===ROAD){log('道には建てられません');return}
  if(S.grid[row][c]){sfx('tap');openBuildingInfo(c,row)}else{sfx('tap');openBuild({c,r:row})}
});

/* ---------- nav icons ---------- */
function navIcons(){
  document.querySelectorAll('nav canvas').forEach(c=>{c.width=12;c.height=12;const x=c.getContext('2d');const p=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};const k=c.dataset.ic;
    if(k==='build'){p(1,5,10,6,'#f0dcb0');for(let i=0;i<5;i++)p(5-i,i,2+i*2,1,'#c8443a');p(5,8,2,3,'#5a3a1e')}
    else if(k==='advs'){p(3,3,6,7,'#f4f1e6');p(4,0,1,3,'#5aa83e');p(7,0,1,3,'#5aa83e');p(4,6,1,1,'#222');p(7,6,1,1,'#222');p(10,2,1,6,'#dfe5ea')}
    else if(k==='dun'){p(1,1,10,11,'#7a838d');p(3,4,6,8,'#141820');p(5,7,2,2,'#ffd04a')}
    else if(k==='goal'){p(2,1,1,11,'#a8733f');p(3,1,8,5,'#ef6a5a');p(5,3,2,1,'#fff')}
    else{p(1,1,4,4,'#f2c53d');p(7,7,4,4,'#4f8fe0');p(5,5,2,2,'#fff');p(7,1,4,4,'#ef6a5a');p(1,7,4,4,'#7cc265')}});
}

/* ---------- boot ---------- */
function offline(){
  const away=(Date.now()-S.last)/1000;if(away<60)return;
  const sec=Math.min(away,4*3600),rate=Math.max(S.income||0,.3);
  const g=Math.round(rate*sec*.5);S.gold+=g;S.stats.earned+=g;
  S.advs.forEach(a=>{if(a.state==='dungeon'){a.dun.end=Date.now()+2000+rnd(6000)}else{a.state='idle';a.timer=Math.random()*2}});
  const days=Math.floor(sec/DAY_SEC);S.day+=days;
  setTimeout(()=>banner('おかえりなさい','留守のあいだも村はにぎわっていた。売上 '+fmt(g)+'G'),500);
}
function start(){
  const l=load();S=l||fresh();
  S.advs.forEach(a=>{if(a.state==='walk'||a.state==='in'||a.state==='fight'){a.state='idle';a.timer=Math.random()*2;if(a.inB){const out=[a.inB.c,a.inB.r+1];a.x=cx(ROAD);a.y=cy(Math.min(GH-1,a.inB.r))}a.inB=null}a.path=null;a.then=null});
  refreshCombos(true);
  if(l)offline();else{log('ようこそ！ 空いているマスをタップして、建物を建てよう');setTimeout(()=>banner('やさいっこ冒険村へようこそ','建物を建てると、冒険者がやってきます'),400)}
  navIcons();resize();updateUI();
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('#wrap'));else addEventListener('resize',resize);
  let last=performance.now();
  function frame(tm){const dt=Math.min(.1,(tm-last)/1000);last=tm;update(dt);render(tm/1000);requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  setInterval(()=>{if(document.hidden){update(1)}},1000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
  updateSnd();auWant(night()?'night':'day');
}
start();
})();
</script>
