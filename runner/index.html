<html lang="ja">
<head>

<body>
<title>そらかけランナー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Mochiy+Pop+One&display=swap">
<style>
/* Layout: 横向き。ゲームは全面キャンバス。HUD（スコア枠・距離・アイテム枠・一時停止・下のフィーバーゲージ）を上にかぶせる。ショップは左に「チーム＋強化」、右に「ゴールド・召喚・事前アイテム・スタート」。 */
:root{
  --pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --pop:"Mochiy Pop One","DotGothic16","Hiragino Maru Gothic ProN",sans-serif;
  --wood:#c8823a;--wood-d:#7a3e14;--wood-l:#f6d9a0;--cream:#fff3d6;--red:#e8502a;--green:#3ab84a;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#120c08;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{font-family:var(--pix);color:#4a2408;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffe04a;outline-offset:2px}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;image-rendering:pixelated;touch-action:none}
.o{text-shadow:-2px 0 var(--oc,#4a1a00),2px 0 var(--oc,#4a1a00),0 -2px var(--oc,#4a1a00),0 2px var(--oc,#4a1a00),-1px -1px var(--oc,#4a1a00),1px 1px var(--oc,#4a1a00),1px -1px var(--oc,#4a1a00),-1px 1px var(--oc,#4a1a00)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.scorebox{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(6px + env(safe-area-inset-top,0px));min-width:150px;background:linear-gradient(#5a2a0a,#3a1a04);border:3px solid #e8a03a;border-radius:8px;padding:10px 12px 2px;font-family:var(--pop);color:#ffe27a;font-size:20px;text-align:right;--oc:#3a1400}
.scorebox::before{content:'Score';position:absolute;left:8px;top:-12px;font-size:14px;color:#ffb030;font-style:italic;text-shadow:-1px 0 #3a1400,1px 0 #3a1400,0 -1px #3a1400,0 1px #3a1400}
#bonus{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(98px + env(safe-area-inset-top,0px));font-family:var(--pop);font-style:italic;font-size:20px;color:#8aff6a;--oc:#0a3a0a}
#coinH{position:absolute;left:max(12px,calc(env(safe-area-inset-left,0px) + 4px));top:calc(74px + env(safe-area-inset-top,0px));font-family:var(--pop);font-size:16px;color:#ffd23a;--oc:#5a2a00}
#hp{position:absolute;left:max(12px,calc(env(safe-area-inset-left,0px) + 4px));top:calc(52px + env(safe-area-inset-top,0px));display:flex;gap:2px}
#hp canvas{width:22px;height:20px;image-rendering:pixelated}
.dist{position:absolute;left:50%;top:calc(4px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:4px;font-family:var(--pop);font-size:26px;color:#fff;--oc:#2a2a3a}
.dist canvas{width:30px;height:30px}
.slots{position:absolute;right:calc(max(10px,env(safe-area-inset-right,0px)) + 52px);top:calc(6px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.slot{position:relative;width:38px;height:38px;border:2px solid #fff;border-radius:7px;background:#00000055;overflow:hidden}
.slot canvas{width:34px;height:34px;image-rendering:pixelated}
.slot i{position:absolute;left:0;bottom:0;height:4px;background:#ffe04a}
#pauseB{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(6px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:50%;border:3px solid #ffd04a;background:radial-gradient(#ffb030,#c86a10);color:#fff;font-size:18px;pointer-events:auto;font-family:var(--pop)}
.fever{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(46%,380px);height:22px;border:3px solid #7a3e14;border-radius:14px;background:#3a1a04;overflow:visible}
.fever u{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:linear-gradient(#ff8a6a,#e83a1a);width:0}
.fever b{position:absolute;inset:0;text-align:center;font-weight:400;color:#fff;font-size:14px;line-height:16px;--oc:#3a1a04}
.fever canvas{position:absolute;left:-18px;top:-9px;width:34px;height:34px;image-rendering:pixelated}
#teamInfo{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#0a2a3acc;border:3px solid #3ac8d8;border-radius:10px;padding:4px 10px;font-size:15px;color:#8ae8ff;line-height:1.4;transition:opacity .6s}
#teamInfo b{color:#ffd04a;font-weight:400}
/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dim{background:#0a060488}
.ribbon{position:relative;display:inline-block;background:linear-gradient(#ff7a3a,#d83a14);color:#fff;font-family:var(--pop);font-size:24px;padding:4px 40px;border-radius:6px;border:3px solid #8a2008;--oc:#7a1a04;box-shadow:0 3px 0 #5a1004}
.ribbon::before,.ribbon::after{content:'';position:absolute;top:8px;width:22px;height:100%;background:#b82a0e;z-index:-1}
.ribbon::before{left:-16px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}.ribbon::after{right:-16px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.woodbox{background:var(--wood);border:4px solid var(--wood-d);border-radius:12px;box-shadow:inset 0 0 0 3px #e8a85a,0 5px 0 #3a1a04;padding:8px}
.cream{background:var(--cream);border:3px solid #e8b870;border-radius:10px}
.btn{border:3px solid #7a2a08;border-radius:12px;background:linear-gradient(#ff8a5a,#e0502a);color:#fff;font-family:var(--pop);font-size:17px;padding:6px 14px;box-shadow:0 4px 0 #6a1a04;--oc:#7a1a04}
.btn.g{border-color:#1a6a1a;background:linear-gradient(#6ae05a,#2aa83a);box-shadow:0 4px 0 #0a4a0a;--oc:#0a4a0a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a1004}
.btn[aria-disabled="true"]{filter:grayscale(1);opacity:.6}
/* title */
#sTitle{flex-direction:column;gap:14px;text-align:center}
.logo{font-family:var(--pop);font-size:clamp(34px,10vh,72px);color:#fff;--oc:#1a3a8a;line-height:1.05;transform:rotate(-3deg)}
.logo small{display:block;font-size:.34em;color:#ffe04a;--oc:#7a2a00;transform:rotate(1deg)}
.trow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tinfo{color:#fff;--oc:#1a1a3a;font-size:15px}
/* shop */
#sShop .shop{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;width:min(980px,100%);height:100%;max-height:430px;grid-template-rows:auto minmax(0,1fr) auto}
#sShop .head{grid-column:1/-1;display:flex;justify-content:center;align-items:center;position:relative}
#sShop .back{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:radial-gradient(#6ae05a,#1a8a2a);color:#fff;font-size:24px;box-shadow:0 3px 0 #0a3a0a}
.left{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;min-height:0}
.lt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;min-height:0}
.team{display:flex;flex-direction:column;min-height:0}
.team .nm{background:linear-gradient(#f6d9a0,#e8b870);border-radius:8px 8px 0 0;padding:3px 10px;font-family:var(--pop);font-size:16px;color:#c85a10}
.team .nm em{font-style:normal;color:#2a9ab8}
.team canvas{flex:1;min-height:0;width:100%;background:#3a3040;border-radius:0 0 8px 8px;image-rendering:pixelated}
.ups{display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0}
.up{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;align-items:center;border-bottom:2px dotted #d8a060;padding:2px 0;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.up canvas{width:34px;height:34px;image-rendering:pixelated;background:#8a4a1a;border-radius:6px}
.bar{display:flex;gap:1px}.bar i{width:9px;height:7px;border-radius:2px;background:#d8c8a8}
.up .t{font-family:var(--pop);font-size:13px;color:#7a3a10}.up .t b{color:#e8302a;font-weight:400}
.up .c{font-size:11px;color:#a86a20}
.lb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lb .btn{font-size:14px;padding:4px 6px;line-height:1.2}
.right{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-height:0}
.money{display:flex;gap:8px}
.money span{flex:1;display:flex;align-items:center;gap:6px;background:#5a2a0a;border:2px solid #e8a03a;border-radius:16px;padding:2px 10px;font-family:var(--pop);color:#ffe27a;font-size:16px;justify-content:space-between}
.money canvas{width:22px;height:22px;image-rendering:pixelated}
.goods{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:6px;padding:6px}
.gd{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;background:linear-gradient(#f6d9a0,#e8c080);border:2px solid #c87a2a;border-radius:10px;padding:4px 8px}
.gd canvas{width:52px;height:52px;image-rendering:pixelated;background:#fff4d8;border-radius:8px}
.gd .t{font-family:var(--pop);font-size:14px;color:#c85a10}
.gd .p{font-size:14px;color:#7a3a10}.gd .d{font-size:12px;color:#7a5a3a;line-height:1.3}
.chk{width:34px;height:34px;border:3px solid #7a3a10;border-radius:6px;background:#fff8e8;font-size:26px;line-height:26px;color:#e8a010;font-family:var(--pop)}
.startB{font-size:30px;padding:8px 20px;border-radius:30px;background:linear-gradient(#ffe04a,#ff9a10);border-color:#a84a00;--oc:#a84a00;box-shadow:0 5px 0 #6a2a00}
/* lists (chara/mount/pet) */
.listbox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:#0a060499}
.listbox .woodbox{width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;overflow:auto;min-height:0;padding:4px}
.card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 8px;align-items:center;text-align:left;background:var(--cream);border:3px solid #e8b870;border-radius:10px;padding:6px}
.card canvas{grid-row:span 3;width:64px;height:64px;image-rendering:pixelated;background:linear-gradient(#5a5070,#3a3048);border-radius:8px}
.card .n{font-family:var(--pop);font-size:15px;color:#c85a10}.card .n small{color:#2a9ab8;font-family:var(--pix)}
.card .d{font-size:12px;color:#7a5a3a;line-height:1.3}.card .p{font-size:12px;color:#a86a20}
.card[aria-pressed="true"]{border-color:#ff6a1a;box-shadow:0 0 0 3px #ffb030}
.card.lock canvas{filter:brightness(.25)}
.rar{display:inline-block;font-size:11px;border-radius:4px;padding:0 4px;color:#fff;margin-right:4px}
.rN{background:#8a8a8a}.rR{background:#3a8ae0}.rSR{background:#b84ae0}.rLG{background:linear-gradient(90deg,#ff6a1a,#ffd01a)}
/* WR-style modals */
.mdl{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#0a060499;padding:max(6px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mdl>.woodbox{width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.mh{display:flex;align-items:center;gap:10px;background:linear-gradient(#e0a860,#a86a2a);border-radius:10px;padding:4px 12px;box-shadow:inset 0 -3px 0 #7a4a1a}
.mh h3{flex:1;margin:0;font-family:var(--pop);font-weight:400;color:#fff4d8;font-size:20px;text-align:center;--oc:#6a3a10}
.mh .mny{display:flex;align-items:center;gap:6px;background:#5a2a0a;border:2px solid #e8a03a;border-radius:16px;padding:1px 10px;font-family:var(--pop);color:#ffe27a;font-size:15px}
.mh .mny canvas{width:20px;height:20px;image-rendering:pixelated}
.wcards{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;min-height:0}
.wc{flex:0 0 156px;background:linear-gradient(#fff6e0,#f0d8a8);border:3px solid #e8c070;border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;text-align:center}
.wc .nm{font-family:var(--pop);color:#ffc020;--oc:#8a4a00;font-size:18px;white-space:nowrap}
.wc .pt{width:132px;height:104px;background:radial-gradient(circle at 50% 55%,#fff2c0 0,#e0a860 45%,#9a5a2a 100%);border-radius:6px;position:relative;overflow:hidden}
.wc .pt canvas{width:100%;height:100%;image-rendering:pixelated}
.wc .ti{font-size:14px;color:#7a3a10}
.wc .ds{font-size:13px;color:#d83a1a;line-height:1.3;min-height:2.6em}
.wc[aria-pressed="true"]{border-color:#ffe04a;box-shadow:0 0 0 3px #ffd020,0 0 18px #ffd020}
.wc .price{position:absolute;right:12px;top:118px;background:#000a;color:#ffe04a;border-radius:6px;padding:0 6px;font-family:var(--pop);font-size:14px;z-index:2}
.wc .rl{position:absolute;right:-3px;top:34px;background:#3a8ae0;color:#fff;font-size:12px;padding:1px 8px;border-radius:8px 0 0 8px;z-index:2}
.chains{position:absolute;inset:0;pointer-events:none;z-index:1}
.chains::before,.chains::after{content:'';position:absolute;left:-10%;top:46%;width:120%;height:10px;background:repeating-linear-gradient(90deg,#3a3a3a 0 9px,#8a8a8a 9px 14px);border:1px solid #1a1a1a}
.chains::before{transform:rotate(35deg)}.chains::after{transform:rotate(-35deg)}
.chains i{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:30px;height:24px;background:linear-gradient(#c8c8d0,#7a7a88);border:3px solid #3a3a48;border-radius:6px}
.chains i::before{content:'';position:absolute;left:3px;top:-17px;width:12px;height:14px;border:4px solid #5a5a6a;border-bottom:none;border-radius:10px 10px 0 0}
.mf{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn.o2{background:linear-gradient(#ffc040,#ff8a10);border-color:#a84a00;--oc:#8a3a00;box-shadow:0 4px 0 #6a2a00}
.btn.on{box-shadow:0 0 0 3px #3a8ae0,0 4px 0 #6a2a00}
.cat{display:flex;gap:20px;justify-content:center;padding:6px}
.catc{width:190px;border-radius:12px;border:4px solid #e8c070;background:linear-gradient(#fff2c8,#f0d090);padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.catc.p{background:linear-gradient(#ffd860,#ff9a10);border-color:#ffe890}
.catc .nm{font-family:var(--pop);font-size:16px;color:#fff;--oc:#8a4a00}
.catc canvas{width:150px;height:120px;image-rendering:pixelated;background:radial-gradient(#fff4d0,#c88a4a);border-radius:8px}
.pgw{display:flex;align-items:center;gap:6px;min-height:0}
.pgrid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 6px;background:#8a4a1a;border-radius:10px;padding:8px}
.ped{display:flex;flex-direction:column;align-items:center;background:none;border:none;padding:0}
.ped canvas{width:88px;height:64px;image-rendering:pixelated;margin-bottom:-12px;position:relative;z-index:1}
.ped .base{width:74px;height:24px;border-radius:50%;background:radial-gradient(#ffe070,#d89a20);border:2px solid #a86a10;font-size:11px;color:#6a3a00;display:flex;align-items:flex-end;justify-content:center;padding-bottom:1px;box-shadow:0 4px 0 #8a5a10;white-space:nowrap}
.ped.no .base{background:radial-gradient(#c8c8d0,#7a7a88);border-color:#4a4a5a;color:#1a1a2a;box-shadow:0 4px 0 #3a3a48}
.ped.no canvas{filter:brightness(.35)}
.ped.sel .base{outline:3px solid #ffe04a}
.pgnav{border:none;background:none;font-size:30px;color:#ffc020;padding:0 4px}
.pity{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-family:var(--pop);font-size:12px;background:#6a3a14;border-radius:10px;padding:6px 10px}
.pity .l1{color:#ffc040}.pity .l2{color:#6ac8ff}
.pbar{height:16px;background:#3a1a04;border-radius:8px;position:relative;overflow:hidden;color:#fff;font-size:11px;text-align:center;line-height:16px}
.pbar u{position:absolute;left:0;top:0;bottom:0;background:#e8a020}.pbar span{position:relative}
.pinfo{width:min(440px,96%)!important;background:var(--cream)!important}
.pih{background:linear-gradient(#ffb040,#ff8a10);color:#fff;font-family:var(--pop);text-align:center;font-size:20px;border-radius:8px;--oc:#8a4a00}
.pib{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
.pib .pv{background:#8a4a1a;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:6px}
.pib .pv canvas{width:110px;height:80px;image-rendering:pixelated}
.pib .stars{color:#ffd020;font-size:18px;letter-spacing:2px}
.pib .spb{background:#f6dca0;border-radius:10px;padding:6px;text-align:center}
.pib .spb b{display:block;font-family:var(--pop);font-weight:400;color:#c85a10;font-size:16px}
.pib .spb span{color:#2a9ab8;font-size:14px}
.pist{background:#f6dca0;border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.6}
.pist .a{color:#5a2a08}.pist .b{color:#d83a1a}.pist .c{color:#2a9ab8}
/* loading */
#sLoad{background:#000;flex-direction:column;gap:20px}
#sLoad canvas{width:120px;height:96px;image-rendering:pixelated}
#sLoad .say{color:#fff;font-size:20px}
.tip{width:min(640px,90%);background:#5a2a0a;border:3px solid #a85a1a;border-radius:14px;padding:16px 20px 12px;position:relative;color:#ffd890;font-size:17px;line-height:1.6}
.tip::before{content:'TIP';position:absolute;left:18px;top:-16px;font-family:var(--pop);font-size:22px;color:#ffe04a;text-shadow:-2px 0 #6a2a00,2px 0 #6a2a00,0 -2px #6a2a00,0 2px #6a2a00}
/* result */
.resbox{width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.rs{font-family:var(--pop);font-size:36px;color:#ffe04a;--oc:#7a2a00}
.rgrid{display:grid;grid-template-columns:auto auto;gap:2px 18px;font-size:16px;color:#5a2a08}
.rgrid span:nth-child(odd){color:#8a5a2a;text-align:right}
.lvl{font-size:14px;color:#2a7ab8}
.new{font-family:var(--pop);color:#ff3a5a;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
#rot{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#120c08;color:#fff;font-size:20px;text-align:center}
#toast{position:fixed;left:50%;top:24%;transform:translateX(-50%);font-family:var(--pop);font-size:22px;color:#fff;--oc:#2a1a4a;pointer-events:none;white-space:nowrap;z-index:40}
@media (prefers-reduced-motion:reduce){.new{animation:none}}

<script>
(function(){
const $=s=>document.querySelector(s);
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
const AKEY='sorakake-audio';
const mf=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];
const MEL_FIELD=[[[4,1],[7,1],[9,1],[7,1],[4,2],[2,1],[0,1]],[[2,2],[4,1],[0,1],[-3,2],[null,2]],[[0,1],[2,1],[4,1],[5,1],[9,2],[7,2]],[[7,1],[4,1],[2,2],[null,2],[-1,1],[2,1]],
  [[4,1],[7,1],[12,2],[9,1],[7,1],[9,2]],[[12,1],[9,1],[7,2],[4,2],[null,2]],[[5,1],[4,1],[2,1],[0,1],[2,2],[4,2]],[[2,1],[4,1],[2,1],[-1,1],[0,4]]];
const MEL_SHOP=[[[0,1],[2,1],[4,1],[7,1],[9,2],[7,2]],[[9,1],[7,1],[4,1],[2,1],[4,2],[null,2]],[[2,1],[4,1],[5,1],[7,1],[9,1],[12,1],[9,2]],[[7,2],[4,1],[2,1],[0,2],[null,2]],
  [[12,1],[12,1],[9,1],[7,1],[9,2],[12,2]],[[14,1],[12,1],[9,2],[7,2],[null,2]],[[5,1],[7,1],[9,1],[12,1],[9,1],[7,1],[5,2]],[[4,1],[7,1],[2,1],[4,1],[0,4]]];
const MEL_NIGHT=[[[9,3],[7,1],[4,4]],[[5,2],[4,2],[0,4]],[[4,3],[7,1],[12,4]],[[11,2],[7,2],[null,4]],[[9,2],[12,2],[16,2],[14,2]],[[12,4],[9,4]],[[7,2],[9,2],[12,2],[11,2]],[[9,8]]];
function flat(mel){const out=new Array(64).fill(null);mel.forEach((bar,b)=>{let p=0;bar.forEach(([n,l])=>{if(n!=null)out[b*8+p]={n,l};p+=l})});return out}
const AU={ctx:null,bgmG:null,sfxG:null,noise:null,on:{bgm:true,sfx:true},song:null,want:'field',step:0,next:0};
try{const a=JSON.parse(localStorage.getItem(AKEY)||'{}');if(a.bgm!=null)AU.on.bgm=a.bgm;if(a.sfx!=null)AU.on.sfx=a.sfx}catch(e){}
function auSavePref(){try{localStorage.setItem(AKEY,JSON.stringify(AU.on))}catch(e){}}
function auUnlock(c){
  try{const b=c.createBuffer(1,1,22050),src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start(0)}catch(e){}
  const r=c.resume&&c.resume();if(r&&r.then)r.then(updateSnd,()=>{});
}
function auInit(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(AU.ctx){if(AU.ctx.state!=='running'&&!document.hidden)auUnlock(AU.ctx);updateSnd();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC()}catch(e){return}
  AU.ctx=c;if(c.addEventListener)c.addEventListener('statechange',updateSnd);
  const comp=c.createDynamicsCompressor();comp.connect(c.destination);
  const master=c.createGain();master.gain.value=.85;master.connect(comp);
  AU.bgmG=c.createGain();AU.bgmG.gain.value=AU.on.bgm?.42:0;AU.bgmG.connect(master);
  AU.sfxG=c.createGain();AU.sfxG.gain.value=AU.on.sfx?.7:0;AU.sfxG.connect(master);
  const buf=c.createBuffer(1,c.sampleRate*.4,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=buf;
  AU.song=SONGS[AU.want];AU.step=0;AU.next=c.currentTime+.15;
  setInterval(auSchedule,25);
  auUnlock(c);
}
function tone(dest,o){
  const c=AU.ctx,t=o.t,osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.sweep||.1));
  let node=osc;if(o.filt){const bq=c.createBiquadFilter();bq.type='lowpass';bq.frequency.value=o.filt;osc.connect(bq);node=bq}
  node.connect(g);g.connect(dest);
  const a=o.a||.005,v=o.v||.1,len=o.len||0,dec=o.d||.3;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);
  if(len){g.gain.setValueAtTime(v,t+a+len);g.gain.exponentialRampToValueAtTime(.0001,t+a+len+dec)}
  else g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);
  osc.start(t);osc.stop(t+a+len+dec+.05);
}
function hiss(dest,t,v,hp,dur){
  const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(g);g.connect(dest);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.start(t,Math.random()*.3);s.stop(t+dur+.02);
}
function lead(kind,f,t,dur){
  const d=AU.bgmG;
  if(kind==='ocarina'){tone(d,{type:'triangle',f,t,a:.025,len:dur*.8,d:.09,v:.12});tone(d,{type:'sine',f:f*2,t,a:.03,len:dur*.6,d:.08,v:.02})}
  else if(kind==='bell'){tone(d,{type:'sine',f,t,d:1.6,v:.1});tone(d,{type:'sine',f:f*2.76,t,d:.6,v:.025});tone(d,{type:'sine',f:f*5.4,t,d:.25,v:.01})}
  else if(kind==='steel'){tone(d,{type:'sine',f,t,d:.45,v:.11});tone(d,{type:'sine',f:f*2,t,d:.25,v:.045});tone(d,{type:'triangle',f:f*3,t,d:.12,v:.015})}
  else if(kind==='chip'){tone(d,{type:'square',f,t,a:.004,len:Math.min(dur*.55,.18),d:.06,v:.035,filt:2200});tone(d,{type:'sine',f,t,d:.2,v:.04})}
}
function auSchedule(){
  const c=AU.ctx;if(!c||c.state!=='running')return;
  if(AU.next<c.currentTime-.2)AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.12){
    const s=AU.song,e=60/s.bpm/2,st=AU.step%64,bar=Math.floor(st/8),pos=st%8,t=AU.next,d=AU.bgmG;
    const ch=PROG[s.prog[bar]],root=s.root;
    const m=s.mel[st];if(m)lead(s.lead,mf(root+m.n),t,m.l*e);
    if(s.sparse){
      if(pos===0){tone(d,{type:'sine',f:mf(root-12+ch[0]),t,a:.2,len:e*6,d:.8,v:.08});ch.forEach((n,i)=>tone(d,{type:'sine',f:mf(root+n),t:t+i*e*.5,d:1.4,v:.022}))}
      if(pos===4)ch.forEach((n,i)=>tone(d,{type:'sine',f:mf(root+12+n),t:t+i*e*.33,d:.9,v:.012}));
    }else{
      if(pos===0)tone(d,{type:'triangle',f:mf(root-12+ch[0]),t,len:e*1.4,d:.15,v:.16,filt:700});
      if(pos===4)tone(d,{type:'triangle',f:mf(root-12+ch[0]+7),t,len:e*1.2,d:.15,v:.13,filt:700});
      if(pos===2||pos===6)ch.forEach(n=>tone(d,{type:'triangle',f:mf(root+n),t,d:.16,v:.03}));
      if(s.lead==='chip'&&(pos===3||pos===7))ch.forEach(n=>tone(d,{type:'triangle',f:mf(root+n),t,d:.1,v:.018}));
      hiss(d,t,pos%2?.028:.016,7000,.035);
      if(s.kick&&(pos===0||pos===4))tone(d,{type:'sine',f:140,f2:45,sweep:.12,t,d:.14,v:.22});
    }
    AU.step++;
    AU.next+=e*(1+(pos%2?-s.swing:s.swing));
    if(AU.step%8===0&&SONGS[AU.want]!==AU.song){AU.song=SONGS[AU.want];AU.step=0}
  }
}
const MEL_BATTLE=[[[9,1],[12,1],[16,1],[12,1],[9,1],[12,1],[16,2]],[[17,1],[16,1],[12,1],[9,1],[5,2],[9,2]],[[7,1],[11,1],[14,1],[11,1],[19,2],[14,2]],[[16,1],[14,1],[12,1],[11,1],[9,4]],
  [[21,1],[19,1],[16,1],[19,1],[21,2],[16,2]],[[17,1],[21,1],[24,2],[21,2],[17,2]],[[19,1],[17,1],[14,1],[11,1],[14,2],[19,2]],[[16,1],[12,1],[11,1],[12,1],[9,4]]];


const SONGS={
  title:{name:'そらのうた',bpm:100,root:60,lead:'ocarina',prog:[0,1,2,3,0,1,2,3],mel:flat(MEL_SHOP),swing:.1,kick:false},
  run:{name:'かぜのうた',bpm:152,root:62,lead:'chip',prog:[0,3,1,2,0,3,1,2],mel:flat(MEL_FIELD),swing:0,kick:true},
  fever:{name:'フィーバー',bpm:178,root:64,lead:'chip',prog:[1,2,3,1,1,2,3,1],mel:flat(MEL_BATTLE),swing:0,kick:true}
};
AU.want='title';
function auWant(w){if(SONGS[w])AU.want=w}
let starPitch=0;
function sfx(name){
  if(!AU.ctx||!AU.on.sfx||AU.ctx.state!=='running')return;
  const t=AU.ctx.currentTime,d=AU.sfxG,sq=(f,dt,len,v)=>tone(d,{type:'square',f,t:t+dt,d:len,v:v||.028,filt:5000});

    case'jump2':tone(d,{type:'square',f:600,f2:1200,sweep:.08,t,d:.1,v:.03,filt:3500});break;
    case'star':sq(mf(84+[0,2,4,7,9,12,14,16,19,21,24][starPitch%11]),0,.05,.02);break;
    case'wstar':[0,7,12,19].forEach((n,i)=>sq(mf(84+n),i*.04,.06,.03));break;
    case'coin':sq(1318,0,.04);sq(1976,.05,.1);break;

    case'smash':hiss(d,t,.12,1800,.12);tone(d,{type:'square',f:500,f2:150,sweep:.12,t,d:.12,v:.04,filt:2000});break;
    case'stomp':tone(d,{type:'square',f:220,f2:660,sweep:.08,t,d:.1,v:.05,filt:2500});break;
    case'item':[0,4,7,12,16].forEach((n,i)=>sq(mf(76+n),i*.05,.08,.035));break;
    case'fever':[0,4,7,12,7,12,16,19,24].forEach((n,i)=>sq(mf(72+n),i*.06,i===8?.4:.08,.045));break;
    case'boost':tone(d,{type:'sawtooth',f:200,f2:900,sweep:.4,t,d:.45,v:.04,filt:2500});hiss(d,t,.4,3000,.06);break;
    case'die':[12,7,4,0,-5].forEach((n,i)=>sq(mf(72+n),i*.12,.16,.045));break;
    case'tap':tone(d,{type:'square',f:880,t,d:.04,v:.025,filt:3000});break;
    case'buy':[0,4,7,12].forEach((n,i)=>sq(mf(79+n),i*.07,.1,.04));break;
    case'no':sq(220,0,.08);sq(180,.09,.12);break;
    case'lvup':[0,4,7,12,16,19,24].forEach((n,i)=>sq(mf(72+n),i*.07,i===6?.4:.1,.045));break;
    case'gacha':[0,2,4,5,7,9,11,12].forEach((n,i)=>sq(mf(72+n),i*.06,.08,.04));[0,4,7,12].forEach((n,i)=>tone(d,{type:'triangle',f:mf(84+n),t:t+.55+i*.02,d:.8,v:.05}));break;
  }

let R=null,state='title',paused=false;
const GRAV=1000,JV=-345,JV2=-320,PX=.3,GY=120;
function newRun(){
  const C=CHARAS[SV.ch],M=MOUNTS[SV.mt],Pt=PETS[SV.pet]||{};
  const hpMax=C.hp+(M.hp||0)+(SV.pre.heart?1:0);
  const tb=teamBonus(SV.ch);
  R={t:0,x:0,y:GY,vy:0,onG:true,jumps:0,maxJ:M.jumps,hp:hpMax,hpMax,inv:0,dist:0,speed:170,score:0,nstar:0,nw:0,coins:0,combo:0,bonusN:0,bonusT:0,maxCombo:0,fever:0,feverT:0,feverBanner:0,
    it:{magnet:0,bridge:0,giant:0,fly:0,dash:0},barrier:(SV.pre.barrier||Pt.barrier)?1:0,revive:(M.revive?1:0)+(Pt.revive?1:0),ch:SV.ch,relayUsed:!SV.relay||SV.relay===SV.ch||!SV.own[SV.relay],gold:0,hold:false,glide:false,tb,
    ground:[{x0:-200,x1:640,y:GY}],plats:[],stars:[],coins_:[],enemies:[],items:[],parts:[],floats:[],genX:640,stage:0,dead:false,deadT:0,petX:-30,petY:GY,petVy:0,petOnG:true,stomps:0,smash:0,hitT:0,continued:false,why:''};
  for(let i=0;i<10;i++)R.stars.push({x:200+i*16,y:GY-14});
  // pre-items
  ['dash','barrier','heart'].forEach(k=>{if(SV.pre[k]){if(SV.gold>=PRE[k].cost)SV.gold-=PRE[k].cost;else SV.pre[k]=0}});
  if(SV.pre.dash){R.it.dash=1;R.dashTo=4000}
  if(C.dash&&!R.it.dash){R.it.dash=1;R.dashTo=C.dash}
  save();
}
const diff=()=>clamp(R.dist/3000,0,1)+Math.max(0,(R.dist-3000)/6000);
function baseSpeed(){return 170+Math.min(160,R.dist*.035)+Math.max(0,R.dist-5000)*.01}
function speedNow(){if(R.it.dash)return 700;return baseSpeed()*(R.feverT>0?1.5:R.it.fly>0?1.3:1)}

/* ---- level gen ---- */
const wRate=()=>.012+(CHARAS[R.ch].wstar||0)*.3+upVal('wstar')/100*.03;
function S(x,y){R.stars.push({x,y,k:Math.random()<wRate()?'w':null,ph:Math.random()*6})}
function starLine(x0,x1,y,step){for(let x=x0;x<=x1;x+=step||16)S(x,y)}
function jumpPath(x0,y0,sp,nj,landY){
  // 実際のジャンプと同じ物理で軌道を計算して星を置く（星の中心は足もとから14px上）
  const pts=[];let x=x0,y=y0,vy=JV,j=1,dt=1/60,lastX=-1e9,up=true;
  for(let i=0;i<240;i++){vy+=GRAV*dt;y+=vy*dt;x+=sp*dt;if(vy>=-20&&j<nj){vy=JV2;j++}
    if(x-lastX>=16){pts.push([x,y-14]);lastX=x}
    if(vy>0&&y>=(landY!=null?landY:y0))break}
  return pts;
}
function starPath(x0,y0,sp,nj,landY){jumpPath(x0,y0,sp,nj,landY).forEach(([x,y])=>S(x,y))}
function coinRow(x,y,n){for(let i=0;i<n;i++)R.coins_.push({x:x+i*13,y,v:2})}
function starArc(x0,x1,y0,h){const n=Math.max(3,Math.floor((x1-x0)/16));for(let i=0;i<=n;i++){const t=i/n;S(x0+(x1-x0)*t,y0-Math.sin(t*Math.PI)*h)}}
function maybeItem(x,y){const r=Math.random();if(r<.12){const ks=['magnet','bridge','giant','fly','heart'];R.items.push({k:ks[rnd(ks.length)],x,y})}else if(r<.16)R.coins_.push({x,y,v:15,bag:1})}
const coinChance=()=>Math.min(.85,.5*(CHARAS[R.ch].coins||1));

    if(d>.12&&Math.random()<.6){const k=enemyK();R.enemies.push({k,x:x+L*.6,y:lastY,vx:k==='mush'?-30:0,x0:x+20,x1:x+L-20})}R.genX=x+L}
  else if(pick<.46){const gap=rr(40,Math.max(55,gapMax*(.45+.5*d))),L=rr(110,220);
    const ny=clamp(lastY+(Math.random()<.5?0:rnd(3)*16-16),84,128);const nj=(gap+30>sp*.55||ny<lastY-8)?2:1;starPath(x-22,lastY,sp,nj,ny);R.ground.push({x0:x+gap,x1:x+gap+L,y:ny,gapFrom:x});if(Math.random()<coinChance())coinRow(x+gap+30,ny-12,Math.floor((L-50)/13));else starLine(x+gap+30,x+gap+L-20,ny-14,18);
    if(d>.3&&Math.random()<.4)R.enemies.push({k:'spike',x:x+gap+L*.5,y:ny,w:12+rnd(2)*6});R.genX=x+gap+L}

    for(let i=0;i<n;i++){const L=rr(50,90);py=clamp(py+(rnd(3)-1)*(Math.random()<.5?14:20),56,105);R.plats.push({x0:px,x1:px+L,y:py});if(Math.random()<coinChance()*.7)coinRow(px+8,py-12,Math.floor((L-16)/13));else starLine(px+8,px+L-8,py-14,14);if(i===1&&Math.random()<.5)maybeItem(px+L/2,py-28);

      else R.enemies.push({k:Math.random()<.6?'bat':'bird',x:ex,y:lastY-rr(30,56),by:lastY-rr(30,56),ph:Math.random()*6});
      starPath(ex-sp*.34,lastY,sp,1);if(Math.random()<coinChance()*.5)coinRow(ex+sp*.3,lastY-12,5);ex+=rr(110,170)-d*20}R.genX=x+L}

  $('#sGacha').hidden=false;withCtx($('#gaCv'),()=>{g.clearRect(0,0,40,40);P(0,0,40,40,rr_==='LG'?'#5a3a10':rr_==='SR'?'#4a2a5a':'#3a3048');for(let i=0;i<12;i++){const a=i/12*Math.PI*2;P(20+Math.round(Math.cos(a)*16),22+Math.round(Math.sin(a)*16),2,2,'#ffe04a')}drawPet(got,20,28,0)});
  $('#gaTxt').innerHTML='<span class="rar r'+rr_+'">'+RARN[rr_]+'</span>'+esc(PETS[got].n)+(had?'　Lv.'+SV.pets[got]+'にアップ！':'　ゲット！')+'<br><span style="font-size:14px;font-family:var(--pix)">'+esc(PETS[got].sp)+'</span>';
  $('#gaOk').onclick=()=>{sfx('tap');$('#sGacha').hidden=true;if(!$('#sPetGrid').hidden)renderPetGrid();renderShop()};
}

icon($('#fvIc'),'wstar');

function frame(tm){const dt=Math.min(.05,(tm-last)/1000);last=tm;const t=tm/1000;if(state==='run'&&!paused)update(dt);render(t);present(t);requestAnimationFrame(frame)}
resize();toTitle();requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run'&&!paused)togglePause(true)});
window.__sr={get R(){return R},get SV(){return SV},startRun:()=>{newRun();state='run';paused=false;show(null);$('#hud').hidden=false;hpShown=-1},update,press,release,render,endRun,get state(){return state},openShop,openList,gacha,startRunLoad:startRun};
